location = /settling-workbench {
    return 301 /settling-workbench/;
}

location ~ ^/settling-workbench-api/(docs|redoc|openapi.json|api/v1/openapi.json)$ {
    return 404;
}

location = /settling-workbench-api/api/v1/users/signup {
    return 404;
}

location ^~ /settling-workbench-api/ {
    client_max_body_size 512m;
    proxy_pass http://127.0.0.1:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ^~ /settling-workbench/assets/ {
    alias /opt/settling-workbench/frontend/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /settling-workbench/ {
    alias /opt/settling-workbench/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /settling-workbench/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
