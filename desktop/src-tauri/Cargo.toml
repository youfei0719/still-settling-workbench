[package]
name = "douyin-writing-skills-desktop"
version = "0.1.11"
description = "Douyin Writing Skills local-first desktop workbench"
authors = ["douyin-writing-skills contributors"]
edition = "2021"

[lib]
name = "douyin_writing_skills_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chromiumoxide = "0.9.1"
dirs = "6"
futures = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"
